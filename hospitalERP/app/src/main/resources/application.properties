spring.config.import=optional:file:.env[.properties]
spring.application.name=hospitalERP

#db configuration
spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# The schema is owned by the Flyway migrations in db/migration; Hibernate only checks that it matches the entities
spring.jpa.hibernate.ddl-auto = validate
# An existing database without Flyway history (created by the old ddl-auto=update) is taken as version 1
# (= V1__baseline.sql); only the later migrations run on it
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql = ${SHOW_SQL:false}

# security
# Base64-encoded secret of at least 32 bytes, e.g. `openssl rand -base64 48`.
# If empty, a random key is generated at startup and every restart logs all users out.
jwt.secret=${JWT_SECRET:}
# The access token: 15 minutes; the login itself lasts through the refresh token (docs/SAFER_LOGIN_TOKENS_PLAN.md)
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Login sessions: the refresh token's cookie is Secure when AUTH_COOKIE_SECURE=true (set it behind HTTPS); patients stay
# logged in for 7 days after the last use (at most 90 days), staff 12 hours after logging in
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.patient-idle-days=${AUTH_PATIENT_IDLE_DAYS:7}
app.auth.patient-max-days=${AUTH_PATIENT_MAX_DAYS:90}
app.auth.staff-hours=${AUTH_STAFF_HOURS:12}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# When true, /api/auth/register only succeeds for a phone number verified via OTP
app.otp.required=${OTP_REQUIRED:true}
# Optional: creates this ADMIN account at startup if it doesn't exist yet (see AdminBootstrap)
app.bootstrap-admin.username=${ADMIN_USERNAME:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.phone=${ADMIN_PHONE:0000000000}

# file uploads
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# email (optional; failures are logged, never block a request)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# twilio SMS (optional; SMS is skipped when the account SID is empty)
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
twilio.trialNumber=${TWILIO_TRIAL_NUMBER:}

# day-before appointment reminders (cron: second minute hour day month weekday)
app.reminders.enabled=${REMINDERS_ENABLED:true}
app.reminders.cron=${REMINDERS_CRON:0 0 * * * *}

# shown on prescription PDFs
app.hospital.name=${HOSPITAL_NAME:Hospital ERP}
app.hospital.address=${HOSPITAL_ADDRESS:}
app.hospital.phone=${HOSPITAL_PHONE:}
# Patients can't cancel or move a visit this many hours before it starts (docs/CANCELLATION_CUTOFF_PLAN.md); 0: no cut-off
app.appointments.change-cutoff-hours=${APPOINTMENT_CHANGE_CUTOFF_HOURS:2}
# Billing (docs/BILLING_PLAN.md): the consultation fee in rupees for doctors without their own
app.billing.default-fee=${BILLING_DEFAULT_FEE:0}
# Online payment with Razorpay (docs/ONLINE_PAYMENT_PLAN.md): on only when the key id and secret are set. Without the
# webhook secret Razorpay's webhook is refused (payments are still confirmed by the app). The API URL is for tests.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.api-url=${RAZORPAY_API_URL:https://api.razorpay.com/v1}

management.endpoints.web.exposure.include=health
# Email is optional (without SMTP settings mails are skipped), so it must not turn the health check DOWN
management.health.mail.enabled=false
