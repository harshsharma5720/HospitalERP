spring.config.import=optional:file:.env[.properties]
spring.application.name=hospitalERP

#db configuration
spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# TODO: replace with Flyway/Liquibase migrations before going to production
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = ${SHOW_SQL:false}

# security
# Base64-encoded secret of at least 32 bytes, e.g. `openssl rand -base64 48`.
# If empty, a random key is generated at startup and every restart logs all users out.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# When true, /api/auth/register only succeeds for a phone number verified via OTP
app.otp.required=${OTP_REQUIRED:true}
# Optional: creates this ADMIN account at startup if it doesn't exist yet (see AdminBootstrap)
app.bootstrap-admin.username=${ADMIN_USERNAME:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.phone=${ADMIN_PHONE:0000000000}

# file uploads
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# email (optional; failures are logged, never block a request)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# twilio SMS (optional; SMS is skipped when the account SID is empty)
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
twilio.trialNumber=${TWILIO_TRIAL_NUMBER:}

# day-before appointment reminders (cron: second minute hour day month weekday)
app.reminders.enabled=${REMINDERS_ENABLED:true}
app.reminders.cron=${REMINDERS_CRON:0 0 * * * *}

# shown on prescription PDFs
app.hospital.name=${HOSPITAL_NAME:Hospital ERP}
app.hospital.address=${HOSPITAL_ADDRESS:}
app.hospital.phone=${HOSPITAL_PHONE:}

management.endpoints.web.exposure.include=health
