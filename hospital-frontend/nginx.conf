server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Profile images are up to 2 MB; leave room for the rest of the multipart request
    client_max_body_size 5m;

    # API and uploaded files → backend container (service "backend" in docker-compose.yml)
    location ~ ^/(api|appointment|uploads)/ {
        proxy_pass http://backend:8080;
        # $http_host keeps the port, so the backend sees the same origin as the browser (no CORS check)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React routes (/doctor/dashboard, /appointments, ...) are handled in the browser
    location / {
        try_files $uri $uri/ /index.html;
    }
}
