# Runs the whole system: MySQL 8 + backend (Spring Boot) + frontend (React on nginx).
#
#   1. cp .env.docker.example .env      (then fill in the values)
#   2. docker compose up --build
#   3. open http://localhost:3000       (backend directly: http://localhost:8080)
#
# On the first start Flyway creates all tables in the empty database. Data and uploaded
# profile images live in named volumes and survive "docker compose down" (add -v to wipe them).
# Every night the "backup" service saves both into ./backups (docs/BACKUPS.md).
name: hospitalerp

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hospital_erp
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_USER: ${DB_USERNAME:-hospital}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # For a MySQL client on your machine (3306 is often taken by a local MySQL)
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./hospitalERP
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hospital_erp?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-hospital}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}
      # Without Twilio nobody could sign up with OTP on, so it defaults to off here
      OTP_REQUIRED: ${OTP_REQUIRED:-false}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_TRIAL_NUMBER: ${TWILIO_TRIAL_NUMBER:-}
      HOSPITAL_NAME: ${HOSPITAL_NAME:-Hospital ERP}
      HOSPITAL_ADDRESS: ${HOSPITAL_ADDRESS:-}
      HOSPITAL_PHONE: ${HOSPITAL_PHONE:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./hospital-frontend
      args:
        # "/" = the browser calls the API on the frontend's own address; nginx forwards it to the backend
        REACT_APP_API_URL: /
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  # Nightly backup of the database and the uploaded images into ./backups (docs/BACKUPS.md):
  # the 7 newest are kept plus the newest of each of the last 4 weeks; LAST_RUN.txt says if the last one worked.
  #   docker compose exec backup bash /scripts/entrypoint.sh backup                one backup now
  #   docker compose exec backup bash /scripts/entrypoint.sh list                  backups + last result
  #   docker compose stop backend
  #   docker compose exec backup bash /scripts/entrypoint.sh restore <name> --yes  then: docker compose start backend
  backup:
    image: mysql:8.0 # for its mysqldump, which matches the server
    entrypoint: ["bash", "/scripts/entrypoint.sh"]
    command: ["schedule"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: hospital_erp
      DB_USER: root
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      TZ: ${BACKUP_TZ:-Asia/Kolkata}
      KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./docker/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
